<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Mario Bros. — clean room</title>
<style>
  :root { --bg:#101218; --fg:#e8e8ee; --dim:#9aa0ad; --accent:#e0522f; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #game { flex:1; min-height:0; }
  #bar { padding:6px 12px; color:var(--dim); font-size:12px; display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center; }
  #bar b { color:var(--fg); font-weight:600; }
  #bar a { color:var(--dim); }
  #bar a.ver { padding:2px 10px; border:1px solid #3a3f4d; border-radius:10px; text-decoration:none; }
  #bar a.ver.on { color:#fff; border-color:var(--accent); background:var(--accent); }
  @media (max-width: 640px) { #keys { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="bar">
    <span><b>Super Mario Bros. — clean room</b> (every tile and palette redrawn; <a href="https://github.com/andrewnakas/smb-cleanroom" target="_blank" rel="noopener">source</a>)</span>
    <span id="keys">Keys: <b>Arrows</b> move · <b>X</b> jump (A) · <b>Z</b> run / fire (B) · <b>Enter</b> Start · <b>Shift</b> Select. Gamepads and touch work too.</span>
  </div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  // libretro joypad ids: 0 B, 2 Select, 3 Start, 4 Up, 5 Down, 6 Left, 7 Right, 8 A
  const k = (v, g) => ({ value: v, value2: g || "" });
  const P1 = {
    0: k("z", "BUTTON_1"), 8: k("x", "BUTTON_2"), 2: k("shift", "SELECT"), 3: k("enter", "START"),
    4: k("up arrow", "DPAD_UP"), 5: k("down arrow", "DPAD_DOWN"),
    6: k("left arrow", "DPAD_LEFT"), 7: k("right arrow", "DPAD_RIGHT"),
  };
  window.EJS_player = "#game";
  window.EJS_core = "nes";
  window.EJS_gameName = "smb-cleanroom";
  window.EJS_gameUrl = q.get("rom") || "smb.nes";
  window.EJS_pathtodata = "data/";
  window.EJS_startOnLoaded = !!(q.get("autostart") || q.get("dump"));   // otherwise one tap starts game and sound
  window.EJS_disableDatabases = false;
  window.EJS_threads = false;
  window.EJS_color = "#e0522f";
  window.EJS_backgroundColor = "#101218";
  window.EJS_defaultControls = { 0: P1, 1: {}, 2: {}, 3: {} };
  window.EJS_defaultOptions = { "save-state-location": "browser" };
  for (const kv of (q.get("opts") || "").split(";").filter(Boolean)) {
    const i = kv.indexOf(":");
    window.EJS_defaultOptions[kv.slice(0, i)] = kv.slice(i + 1);
  }

  // dev: ?audiolog=1 logs the level of the audio the emulator queues
  if (q.get("audiolog")) {
    let n = 0, sum = 0, cnt = 0, peak = 0;
    const st = AudioBufferSourceNode.prototype.start;
    AudioBufferSourceNode.prototype.start = function () {
      try {
        const d = this.buffer.getChannelData(0);
        for (let i = 0; i < d.length; i += 4) { const v = d[i] * 32768; sum += v * v; cnt++; if (Math.abs(v) > peak) peak = Math.abs(v); }
        n++;
      } catch (e) {}
      return st.apply(this, arguments);
    };
    setInterval(() => { console.log(`NESAUDIO buffers=${n} rms=${cnt ? Math.sqrt(sum / cnt).toFixed(0) : 0} peak=${peak.toFixed(0)}`); n = 0; sum = 0; cnt = 0; peak = 0; }, 3000);
  }

  // dev hooks: ?dump=5,10 (screenshots to the console), ?keys=t:id:dur,... (seconds, joypad id)
  const log = (m) => console.log(m);
  window.EJS_onGameStart = function () {
    const t0 = performance.now();
    log("NES: game started");
    const E = window.EJS_emulator;
    if (q.get("keys")) {
      for (const ev of q.get("keys").split(",")) {
        const [t, id, dur] = ev.split(":");
        setTimeout(() => E.gameManager.simulateInput(0, +id, 1), +t * 1000);
        setTimeout(() => E.gameManager.simulateInput(0, +id, 0), (+t + (+dur || 0.15)) * 1000);
      }
    }
    if (q.get("dump")) {
      const times = q.get("dump").split(",").map(Number);
      let chain = Promise.resolve();
      const shot = (s) => new Promise((res) => {
        const wait = Math.max(0, t0 + s * 1000 - performance.now());
        setTimeout(() => {
          const done = setTimeout(() => { log(`NES: shot ${s} timed out`); res(); }, 8000);
          try {
            E.screenshot((blob) => {
              const r = new FileReader();
              r.onload = () => {
                const d = r.result, n = 8000;
                for (let o = 0; o < d.length; o += n) log(`PW64PNG:${s}:${d.slice(o, o + n)}`);
                log(`PW64PNG:${s}:END`);
                clearTimeout(done); res();
              };
              r.readAsDataURL(blob);
            }, "canvas", "png", 1);
          } catch (e) { log(`NES: shot ${s} failed ${e}`); clearTimeout(done); res(); }
        }, wait);
      });
      for (const s of times) chain = chain.then(() => shot(s));
    }
  };
})();
</script>
<script src="data/loader.js"></script>
</body>
</html>
